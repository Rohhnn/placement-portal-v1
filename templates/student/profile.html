{% extends 'base.html' %}
{% block title %}Edit Profile{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h2 class="mb-4">Edit Profile</h2>
        <form method="POST" enctype="multipart/form-data">
            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" class="form-control" name="full_name" value="{{ student.full_name }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" name="email" value="{{ student.email or '' }}">
            </div>
            <div class="mb-3">
                <label class="form-label">Phone</label>
                <input type="text" class="form-control" name="phone" value="{{ student.phone or '' }}">
            </div>
            <div class="mb-3">
                <label class="form-label">Education</label>
                <input type="text" class="form-control" name="education" value="{{ student.education or '' }}">
            </div>
            <div class="mb-3">
                <label class="form-label">Skills</label>
                <textarea class="form-control" name="skills" rows="2">{{ student.skills or '' }}</textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">Upload Resume (PDF)</label>
                <input type="file" class="form-control" name="resume" accept=".pdf">
                {% if student.resume_path %}
                    <small class="text-muted">Current: <a href="{{ url_for('static', filename='uploads/' + student.resume_path) }}" target="_blank">{{ student.resume_path }}</a></small>
                {% endif %}
            </div>
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <a href="{{ url_for('student_dashboard') }}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
