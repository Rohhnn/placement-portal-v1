{% extends 'base.html' %}
{% block title %}Register{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card mt-4">
            <div class="card-header text-center">
                <h4>Register</h4>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('register') }}" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" name="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <div class="mb-3">
                        <label for="role" class="form-label">Register as</label>
                        <select class="form-select" id="role" name="role" required onchange="toggleFields()">
                            <option value="" disabled selected>Select role</option>
                            <option value="company">Company</option>
                            <option value="student">Student</option>
                        </select>
                    </div>

                    <!-- Company fields -->
                    <div id="company-fields" style="display:none;">
                        <div class="mb-3">
                            <label class="form-label">Company Name</label>
                            <input type="text" class="form-control" name="company_name">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Industry</label>
                            <input type="text" class="form-control" name="industry">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Website</label>
                            <input type="text" class="form-control" name="website">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">HR Contact</label>
                            <input type="text" class="form-control" name="hr_contact">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea class="form-control" name="description" rows="3"></textarea>
                        </div>
                    </div>

                    <!-- Student fields -->
                    <div id="student-fields" style="display:none;">
                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <input type="text" class="form-control" name="full_name">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" name="email">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Phone</label>
                            <input type="text" class="form-control" name="phone">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Education</label>
                            <input type="text" class="form-control" name="education">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Skills</label>
                            <textarea class="form-control" name="skills" rows="2" placeholder="e.g. Python, SQL, Flask"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Resume (PDF)</label>
                            <input type="file" class="form-control" name="resume" accept=".pdf">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">Register</button>
                </form>
                <p class="text-center mt-3">
                    Already have an account? <a href="{{ url_for('login') }}">Login here</a>
                </p>
            </div>
        </div>
    </div>
</div>

<script>
function toggleFields() {
    var role = document.getElementById('role').value;
    document.getElementById('company-fields').style.display = role === 'company' ? 'block' : 'none';
    document.getElementById('student-fields').style.display = role === 'student' ? 'block' : 'none';
}
</script>
{% endblock %}
